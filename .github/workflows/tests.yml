# Testeur automatique du site : construit le site avec des véhicules d'exemple, puis rejoue les
# parcours de visiteurs sur ordinateur et sur téléphone. En cas d'échec, GitHub envoie un e-mail.
name: Testeur du site

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1" # chaque lundi matin, même sans modification

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Outils du générateur
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Outils du testeur
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Tests
        working-directory: tests
        run: npx playwright test
        env:
          CI: "1"

      - name: Rapport détaillé en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-des-tests
          path: tests/playwright-report
          retention-days: 14
